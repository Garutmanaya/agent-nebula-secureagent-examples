[server]
host = "0.0.0.0"
port = 9011

[agent_card]
name = "Agent capabilities"
description = "Agent capabilities example"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "http://localhost:9011/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

# Change capability flags above only when the deployed server implements them.

[[agent_card.skills]]
id = "example.invoke"
name = "Agent capabilities Skill"
description = "Business skill for Agent capabilities"
tags = ["example", "a2a"]
