[server]
host = "0.0.0.0"
port = 9014
tls_certificate_file = "certs/server.crt"
tls_private_key_file = "secrets/server.key"
tls_trust_bundle_file = "trust/local-ca.crt"

[agent_card]
name = "OAuth scoped skill"
description = "OAuth scoped skill example"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "https://localhost:9014/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[agent_card.security_schemes.oauth.oauth2_security_scheme]
description = "OAuth 2.0 protected A2A endpoint"
oauth2_metadata_url = "https://localhost:8092/.well-known/oauth-authorization-server"

[agent_card.security_schemes.oauth.oauth2_security_scheme.flows.client_credentials]
token_url = "https://localhost:8092/oauth/token"
scopes = { "example.invoke" = "Invoke example skill" }

[[agent_card.security_requirements]]
schemes = { oauth = ["example.invoke"] }

[[agent_card.skills]]
id = "example.invoke"
name = "OAuth scoped skill Skill"
description = "Business skill for OAuth scoped skill"
tags = ["example", "a2a"]

[[agent_card.skills.security_requirements]]
schemes = { oauth = ["example.invoke"] }
