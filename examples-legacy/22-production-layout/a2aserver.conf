[server]
host = "0.0.0.0"
port = 9022
tls_certificate_file = "certs/server.crt"
tls_private_key_file = "secrets/server.key"

[agent_card]
name = "Production filesystem layout"
description = "Production filesystem layout example"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "https://localhost:9022/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "example.invoke"
name = "Production filesystem layout Skill"
description = "Business skill for Production filesystem layout"
tags = ["example", "a2a"]
