[server]
host = "0.0.0.0"
port = 9008

[server.tls]
enabled = true
trust_bundle = "certs/trust-bundle.pem"
certificate_file = "certs/server.crt"
private_key_file = "certs/server.key"

[agent_card]
url = "https://{{AGENT_HOSTNAME}}:9008/.well-known/agent-card.json"
name = "Skill OAuth Registry Agent"
description = "Agent Nebula provider with distinct OAuth scope requirements per skill"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "https://{{AGENT_HOSTNAME}}:9008/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[agent_card.security_schemes.oauth.oauth2_security_scheme]
description = "Agent Nebula OAuth 2.0 least-privilege scopes"
oauth2_metadata_url = "{{OAUTH_URL}}/.well-known/oauth-authorization-server"

[agent_card.security_schemes.oauth.oauth2_security_scheme.flows.client_credentials]
token_url = "{{OAUTH_URL}}/api/v1/oauth/token"
scopes = { "hello.invoke" = "Invoke hello", "echo.invoke" = "Invoke echo", "add.invoke" = "Invoke add" }


[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Return a deterministic greeting"
tags = ["example", "a2a", "multiskill"]
security_requirements = [{ schemes = { oauth = ["hello.invoke"] } }]

[[agent_card.skills]]
id = "echo"
name = "Echo"
description = "Echo a caller-provided value"
tags = ["example", "a2a", "multiskill"]
security_requirements = [{ schemes = { oauth = ["echo.invoke"] } }]

[[agent_card.skills]]
id = "add"
name = "Add"
description = "Add two caller-provided integers"
tags = ["example", "a2a", "multiskill"]
security_requirements = [{ schemes = { oauth = ["add.invoke"] } }]
