[server]
host = "0.0.0.0"
port = 9001

[agent_card]
name = "Basic A2A server"
description = "Basic A2A server example"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "http://localhost:9001/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "example.invoke"
name = "Basic A2A server Skill"
description = "Business skill for Basic A2A server"
tags = ["example", "a2a"]
