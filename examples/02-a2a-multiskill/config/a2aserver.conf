[server]
host = "0.0.0.0"
port = 9002

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9002/.well-known/agent-card.json"
name = "A2A multi-skill agent"
description = "SecureAgent example exposing multiple deterministic A2A skills"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9002/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Return a deterministic greeting"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "echo"
name = "Echo"
description = "Echo a caller-provided value"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "add"
name = "Add"
description = "Add two caller-provided integers"
tags = ["example", "a2a", "multiskill"]
