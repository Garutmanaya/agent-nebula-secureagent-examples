[server]
host = "0.0.0.0"
port = 9003

[server.tls]
enabled = false

[agent_card]
url = "http://localhost:9003/.well-known/agent-card.json"
name = "A2A multi-binding agent"
description = "The same SecureAgent skills exposed through JSON-RPC, HTTP+JSON, and gRPC"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "http://localhost:9003/a2a/rpc"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[[agent_card.supported_interfaces]]
url = "http://localhost:9003/a2a/rest"
protocol_binding = "HTTP+JSON"
protocol_version = "1.0"

[[agent_card.supported_interfaces]]
url = "localhost:50053"
protocol_binding = "GRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Return a deterministic greeting"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "echo"
name = "Echo"
description = "Echo a caller-provided value"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "add"
name = "Add"
description = "Add two caller-provided integers"
tags = ["example", "a2a", "multiskill"]
