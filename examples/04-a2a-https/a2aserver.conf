[server]
host = "0.0.0.0"
port = 9004

[server.tls]
enabled = true
trust_bundle = ".runtime/trust/local-ca.crt"
certificate_file = ".runtime/certs/server.crt"
private_key_file = ".runtime/secrets/server.key"

[agent_card]
name = "HTTPS A2A multi-skill agent"
description = "SecureAgent multi-skill A2A example with verified HTTPS transport"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "https://localhost:9004/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Return a deterministic greeting"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "echo"
name = "Echo"
description = "Echo a caller-provided value"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "add"
name = "Add"
description = "Add two caller-provided integers"
tags = ["example", "a2a", "multiskill"]
