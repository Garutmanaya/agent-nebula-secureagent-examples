[server]
host = "0.0.0.0"
port = 9006

[server.tls]
enabled = true
trust_bundle = "trust/local-ca.crt"
certificate_file = "certs/server.crt"
private_key_file = "secrets/server.key"

[agent_card]
name = "Registry Discovery Agent"
description = "A2A provider registered with and discoverable through Agent Nebula"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "https://localhost:9006/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false


[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Return a deterministic greeting"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "echo"
name = "Echo"
description = "Echo a caller-provided value"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "add"
name = "Add"
description = "Add two caller-provided integers"
tags = ["example", "a2a", "multiskill"]

