[server]
host = "0.0.0.0"
port = 9007

[server.tls]
enabled = true
trust_bundle = "certs/trust-bundle.pem"
certificate_file = "certs/server.crt"
private_key_file = "certs/server.key"

[agent_card]
url = "https://localhost:9007/.well-known/agent-card.json"
name = "OAuth Protected Registry Agent"
description = "Registered Agent Nebula provider protected by OAuth 2.0"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "https://localhost:9007/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[agent_card.security_schemes.oauth.oauth2_security_scheme]
description = "Agent Nebula OAuth 2.0"
oauth2_metadata_url = "https://localhost:8092/.well-known/oauth-authorization-server"

[agent_card.security_schemes.oauth.oauth2_security_scheme.flows.client_credentials]
token_url = "https://localhost:8092/oauth/token"
scopes = { "agent.invoke" = "Invoke this agent" }

[[agent_card.security_requirements]]
schemes = { oauth = ["agent.invoke"] }


[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Return a deterministic greeting"
tags = ["example", "a2a", "multiskill"]
security_requirements = [{ schemes = { oauth = ["agent.invoke"] } }]

[[agent_card.skills]]
id = "echo"
name = "Echo"
description = "Echo a caller-provided value"
tags = ["example", "a2a", "multiskill"]
security_requirements = [{ schemes = { oauth = ["agent.invoke"] } }]

[[agent_card.skills]]
id = "add"
name = "Add"
description = "Add two caller-provided integers"
tags = ["example", "a2a", "multiskill"]
security_requirements = [{ schemes = { oauth = ["agent.invoke"] } }]

