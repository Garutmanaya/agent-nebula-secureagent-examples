[nebula]
base_url = {{NEBULA_URL}}
timeout_seconds = 30

[tls]
mode = full-verify
ca_file = certs/trust-bundle.pem

[registration]
enabled = true
authentication = API_KEY
api_key_file = secrets/onboarding-api-key
state_key = example-09-registration
retry_count = 3
retry_delay_seconds = 1
resolve_before_register = true
