[nebula]
base_url = https://localhost:8000
timeout_seconds = 30

[tls]
mode = full-verify
ca_file = .runtime/trust/agent-nebula-ca.crt

[registration]
enabled = true
authentication = API_KEY
api_key_file = .runtime/secrets/onboarding-api-key
state_key = example-09-registration
retry_count = 3
retry_delay_seconds = 1
resolve_before_register = true
