[server]
host = "0.0.0.0"
port = 9011

[agent_card]
name = "A2A A2UI acceptance agent"
description = "SecureAgent acceptance example for multi-skill A2A with A2UI v1.0 output"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "http://localhost:9011/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "summary"
name = "Summary"
description = "Return an ordinary structured A2A result"
tags = ["example", "a2a", "multiskill"]

[[agent_card.skills]]
id = "forecast"
name = "Forecast"
description = "Return structured business data, metadata, and an A2UI v1.0 surface"
tags = ["example", "a2a", "a2ui", "multiskill"]
