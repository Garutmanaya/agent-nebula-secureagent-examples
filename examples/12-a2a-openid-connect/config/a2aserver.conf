[server]
host = "0.0.0.0"
port = 9012

[server.tls]
enabled = true
trust_bundle = "certs/trust-bundle.pem"
certificate_file = "certs/server.crt"
private_key_file = "certs/server.key"

[agent_card]
url = "https://{{AGENT_HOSTNAME}}:9012/.well-known/agent-card.json"
name = "OpenID Connect"
description = "A2A v1.0 security example"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "https://{{AGENT_HOSTNAME}}:9012/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[agent_card.security_schemes.oidc.open_id_connect_security_scheme]
description="OIDC bearer JWT"
open_id_connect_url="https://issuer.example/.well-known/openid-configuration"

[[agent_card.security_requirements]]
schemes={ oidc=[] }

[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Return a deterministic authenticated greeting"
tags = ["example", "a2a", "security"]

[security.oidc.oidc]
issuer="https://issuer.example"
audiences=["a2a-example"]
discovery_url="https://issuer.example/.well-known/openid-configuration"
verification_certificate_file="certs/client.crt"
key_id="example-oidc-key"
algorithm="RS256"
