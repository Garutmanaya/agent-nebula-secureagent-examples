[client]
streaming=false
polling=false
supported_protocol_bindings=["JSONRPC"]
use_client_preference=false
accepted_output_modes=["application/json"]
timeout_seconds=30.0
[client.credentials.api_key]
secret_file="secrets/a2a-api-key"
[client.credentials.http_bearer]
secret_file="secrets/a2a-http-bearer"
[client.tls]
enabled=false
trust_bundle="certs/trust-bundle.pem"
