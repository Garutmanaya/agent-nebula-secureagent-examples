[server]
host = "0.0.0.0"
port = 9014

[server.tls]
enabled = true
trust_bundle = "certs/trust-bundle.pem"
certificate_file = "certs/server.crt"
private_key_file = "certs/server.key"

[agent_card]
url = "https://{{AGENT_HOSTNAME}}:9014/.well-known/agent-card.json"
name = "Multiple Security Schemes"
description = "A2A v1.0 security example"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "https://{{AGENT_HOSTNAME}}:9014/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[agent_card.security_schemes.api_key.api_key_security_scheme]
description="Header API key"
location="header"
name="X-API-Key"
[agent_card.security_schemes.http_bearer.http_auth_security_scheme]
description="HTTP Bearer credential"
scheme="Bearer"
bearer_format="opaque"

# Entries are OR alternatives; schemes inside one entry are AND.
[[agent_card.security_requirements]]
schemes={ api_key=[], http_bearer=[] }

[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Return a deterministic authenticated greeting"
tags = ["example", "a2a", "security"]

[security.api_key.api_key]
secret_file="secrets/a2a-api-key"
subject="example-client"
[security.http_auth.http_bearer]
scheme="Bearer"
secret_file="secrets/a2a-http-bearer"
subject="example-client"
