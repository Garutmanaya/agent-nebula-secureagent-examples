# Basic A2A client configuration for the local hello server.

[client]
streaming = false
polling = false
supported_protocol_bindings = ["JSONRPC"]
use_client_preference = false
accepted_output_modes = ["application/json"]
timeout_seconds = 30.0

[client.tls]
# The hello server uses plain HTTP for this introductory local example.
# No client certificate or custom trust bundle is required.
