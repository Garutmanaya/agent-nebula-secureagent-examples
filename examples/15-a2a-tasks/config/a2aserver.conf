[server]
host = "0.0.0.0"
port = 9015

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9015/.well-known/agent-card.json"
name = "Native A2A Tasks server"
description = "Native a2a-sdk multi-skill Message and Task execution through SecureAgent"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["text/plain"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9015/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "hello"
name = "Immediate Message"
description = "Return one native A2A Message without creating a Task"
tags = ["example", "a2a", "message"]

[[agent_card.skills]]
id = "generate-reports"
name = "Generate Reports"
description = "Create a native A2A Task and publish daily, weekly, and monthly report artifacts"
tags = ["example", "a2a", "task", "artifacts"]
