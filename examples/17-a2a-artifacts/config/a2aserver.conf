[server]
host = "0.0.0.0"
port = 9017

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9017/.well-known/agent-card.json"
name = "A2A Artifacts Agent"
description = "Native A2A artifact creation and TaskStore persistence"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["text/plain"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9017/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "build-artifacts"
name = "Build Artifacts"
description = "Create named native A2A artifacts and persist them with the task."
tags = ["example", "a2a"]
