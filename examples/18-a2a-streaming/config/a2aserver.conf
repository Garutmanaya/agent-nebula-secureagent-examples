[server]
host = "0.0.0.0"
port = 9018

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9018/.well-known/agent-card.json"
name = "A2A Streaming Agent"
description = "Native A2A streaming Task status and artifact events"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["text/plain"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9018/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = true
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "stream-report"
name = "Stream Report"
description = "Stream native Task status and artifact updates."
tags = ["example", "a2a"]
