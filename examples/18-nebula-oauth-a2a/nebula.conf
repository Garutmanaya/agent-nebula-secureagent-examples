[nebula]
base_url = https://localhost:8000
timeout_seconds = 30

[tls]
mode = full-verify
ca_file = trust/local-ca.crt

[registration]
enabled = true
authentication = API_KEY
api_key_file = secrets/onboarding-api-key
state_key = example-registration
retry_count = 3
retry_delay_seconds = 1
resolve_before_register = true
