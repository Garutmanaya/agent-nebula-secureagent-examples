[server]
host = "0.0.0.0"
port = 9019

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9019/.well-known/agent-card.json"
name = "A2A Push Notification Agent"
description = "Native A2A Task push-notification configuration and delivery"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["text/plain"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9019/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = true
push_notifications = true
extended_agent_card = false

[[agent_card.skills]]
id = "long-report"
name = "Long Report"
description = "Create a Task long enough to configure and receive push notifications."
tags = ["example", "a2a"]
