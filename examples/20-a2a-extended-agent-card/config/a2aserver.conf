[server]
host = "0.0.0.0"
port = 9020

[server.tls]
enabled = true
trust_bundle = "certs/trust-bundle.pem"
certificate_file = "certs/server.crt"
private_key_file = "certs/server.key"

[agent_card]
url = "https://{{AGENT_HOSTNAME}}:9020/.well-known/agent-card.json"
name = "Public Extended Card Agent"
description = "Public Agent Card; authenticated clients may retrieve a richer extended card."
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["text/plain"]

[[agent_card.supported_interfaces]]
url = "https://{{AGENT_HOSTNAME}}:9020/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = true

[[agent_card.skills]]
id = "hello"
name = "Hello"
description = "Public hello skill."
tags = ["example", "a2a"]

[agent_card.security_schemes.api_key.api_key_security_scheme]
description = "Example API key"
location = "header"
name = "X-API-Key"

[[agent_card.security_requirements]]
schemes = { api_key = [] }

[extended_agent_card]
name = "Authenticated Extended Card Agent"
description = "Authenticated extended Agent Card with additional private operational description."
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["text/plain"]

[[extended_agent_card.supported_interfaces]]
url = "https://{{AGENT_HOSTNAME}}:9020/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[extended_agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = true

[extended_agent_card.security_schemes.api_key.api_key_security_scheme]
description = "Example API key"
location = "header"
name = "X-API-Key"

[[extended_agent_card.security_requirements]]
schemes = { api_key = [] }

[[extended_agent_card.skills]]
id = "hello"
name = "Hello"
description = "Authenticated extended description for the public hello skill."
tags = ["example", "a2a", "extended-card"]

[security.api_key.api_key]
secret_file = "secrets/a2a-api-key"
subject = "example-client"
