[server]
host = "0.0.0.0"
port = 9021

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9021/.well-known/agent-card.json"
name = "Combined A2A Capabilities Agent"
description = "Combined native A2A streaming, Task, artifact, push-notification, and extended-card capabilities"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["text/plain"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9021/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = true
push_notifications = true
extended_agent_card = true

[[agent_card.skills]]
id = "long-report"
name = "Long Report"
description = "Create a Task long enough to configure and receive push notifications."
tags = ["example", "a2a"]

[extended_agent_card]
name = "Combined A2A Capabilities Agent - Extended"
description = "Extended card for the combined native A2A capabilities example."
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["text/plain"]

[[extended_agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9021/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[extended_agent_card.capabilities]
streaming = true
push_notifications = true
extended_agent_card = true

[[extended_agent_card.skills]]
id = "long-report"
name = "Long Report"
description = "Create a streaming Task with an artifact and push-notification support."
tags = ["example", "a2a", "combined"]
