[server]
host = "0.0.0.0"
port = 9012

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9012/.well-known/agent-card.json"
name = "A2A A2UI action agent"
description = "SecureAgent example for bidirectional A2UI v1.0 actions over A2A"
version = "1.0.0"
default_input_modes = ["application/json"]
default_output_modes = ["application/json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9012/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "forecast"
name = "Forecast"
description = "Return a forecast surface and process its A2UI recalculate action"
tags = ["example", "a2a", "a2ui", "actions"]
