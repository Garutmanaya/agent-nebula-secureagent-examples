[server]
host = "0.0.0.0"
port = 9022

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9022/.well-known/agent-card.json"
name = "A2UI Basic server"
description = "Direct A2UI v1.0 Basic Catalog presentation over native a2a-sdk"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9022/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "forecast"
name = "Regional Forecast"
description = "Render a Basic Catalog forecast surface"
tags = ["example", "a2a", "a2ui", "basic"]
