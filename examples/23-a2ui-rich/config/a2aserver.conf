[server]
host = "0.0.0.0"
port = 9023

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9023/.well-known/agent-card.json"
name = "A2UI Mixed Catalog server"
description = "Mixed A2UI v1.0 Basic + Rich Catalog presentation over native a2a-sdk"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9023/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "weather-dashboard"
name = "Weather Dashboard"
description = "Render one mixed Basic and Rich Catalog weather surface"
tags = ["example", "a2a", "a2ui", "basic", "rich", "mixed-catalog"]
