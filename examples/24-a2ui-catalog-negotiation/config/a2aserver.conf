[server]
host = "0.0.0.0"
port = 9024

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9024/.well-known/agent-card.json"
name = "A2UI Catalog Negotiation server"
description = "A2UI v1.0 Basic/Rich catalog negotiation over native a2a-sdk"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9024/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "dashboard"
name = "Dashboard"
description = "Select a mutually supported A2UI catalog from renderer capabilities"
tags = ["example", "a2a", "a2ui", "basic", "rich", "mixed-catalog"]
