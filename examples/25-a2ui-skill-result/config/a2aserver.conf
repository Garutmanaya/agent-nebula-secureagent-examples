[server]
host = "0.0.0.0"
port = 9025

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9025/.well-known/agent-card.json"
name = "A2UI Skill Result server"
description = "Multiple native A2A skills independently produce application-owned A2UI v1.0 results"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9025/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "weather"
name = "Weather"
description = "Return a weather A2UI presentation"
tags = ["example", "a2a", "a2ui", "multi-skill", "weather"]

[[agent_card.skills]]
id = "system-health"
name = "System Health"
description = "Return a system health A2UI presentation"
tags = ["example", "a2a", "a2ui", "multi-skill", "health"]
