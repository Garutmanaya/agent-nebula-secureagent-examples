[server]
host = "0.0.0.0"
port = 9026

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9026/.well-known/agent-card.json"
name = "A2UI Actions Agent"
description = "Native A2A skill accepts renderer A2UI actions and returns incremental A2UI updates"
version = "1.0.0"
default_input_modes = ["text/plain", "application/a2ui+json"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9026/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "counter"
name = "Interactive Counter"
description = "Create an A2UI counter surface and process renderer increment actions"
tags = ["example", "a2a", "a2ui", "actions"]
