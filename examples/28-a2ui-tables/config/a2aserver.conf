[server]
host = "0.0.0.0"
port = 9028

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9028/.well-known/agent-card.json"
name = "A2UI Tables Agent"
description = "Structured tabular A2UI presentation over native A2A"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9028/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "inventory"
name = "Inventory Table"
description = "Render structured inventory data"
tags = ["example", "a2a", "a2ui"]
