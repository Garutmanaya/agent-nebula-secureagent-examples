[server]
host = "0.0.0.0"
port = 9029

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9029/.well-known/agent-card.json"
name = "A2UI Charts Agent"
description = "Chart presentation driven by application data over native A2A"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9029/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "traffic-chart"
name = "Traffic Chart"
description = "Render application traffic as a bar chart"
tags = ["example", "a2a", "a2ui"]
