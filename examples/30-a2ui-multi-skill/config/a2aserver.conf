[server]
host = "0.0.0.0"
port = 9030

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9030/.well-known/agent-card.json"
name = "A2UI Multi-Skill Agent"
description = "Different native A2A skills produce different application-owned A2UI surfaces"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9030/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "inventory"
name = "Inventory Surface"
description = "Render inventory"
tags = ["example", "a2a", "a2ui"]

[[agent_card.skills]]
id = "traffic"
name = "Traffic Surface"
description = "Render traffic"
tags = ["example", "a2a", "a2ui"]
