[server]
host = "0.0.0.0"
port = 9031

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9031/.well-known/agent-card.json"
name = "A2UI Tasks Agent"
description = "Native A2A Task whose artifact carries an application-owned A2UI presentation"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9031/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "generate-report"
name = "Generate Service Report"
description = "Generate a native A2A Task containing an A2UI report artifact"
tags = ["example", "a2a", "a2ui", "task", "artifact"]
