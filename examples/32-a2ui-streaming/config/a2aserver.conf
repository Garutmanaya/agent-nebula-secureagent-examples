[server]
host = "0.0.0.0"
port = 9032

[agent_card]
url = "http://{{AGENT_HOSTNAME}}:9032/.well-known/agent-card.json"
name = "A2UI Streaming Agent"
description = "Native A2A streaming Task whose artifact chunks carry incremental A2UI updates"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "http://{{AGENT_HOSTNAME}}:9032/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = true
push_notifications = false
extended_agent_card = false

[[agent_card.skills]]
id = "stream-traffic"
name = "Stream Traffic"
description = "Stream a native A2A Task artifact containing incremental A2UI chart updates"
tags = ["example", "a2a", "a2ui", "streaming", "artifact"]
