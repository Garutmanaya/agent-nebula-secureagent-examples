[client]
streaming = false
polling = false
supported_protocol_bindings = ["JSONRPC"]
use_client_preference = true
accepted_output_modes = ["application/a2ui+json"]
timeout_seconds = 30.0

[client.tls]
enabled = true
trust_bundle = "certs/trust-bundle.pem"

[client.oauth]
client_id_file = "data/client-id"
authentication_private_key_file = "secrets/oauth-authentication-key.pem"
dpop_private_key_file = "secrets/oauth-dpop-key.pem"
key_id = "secureagent-example-client"
algorithm = "ES256"
