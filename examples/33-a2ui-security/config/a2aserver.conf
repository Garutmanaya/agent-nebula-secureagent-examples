[server]
host = "0.0.0.0"
port = 9033

[server.tls]
enabled = true
trust_bundle = "certs/trust-bundle.pem"
certificate_file = "certs/server.crt"
private_key_file = "certs/server.key"

[agent_card]
url = "https://{{AGENT_HOSTNAME}}:9033/.well-known/agent-card.json"
name = "A2UI Security Agent"
description = "OAuth-protected HTTPS native A2A carrying an A2UI v1.0 presentation"
version = "1.0.0"
default_input_modes = ["text/plain"]
default_output_modes = ["application/a2ui+json"]

[[agent_card.supported_interfaces]]
url = "https://{{AGENT_HOSTNAME}}:9033/"
protocol_binding = "JSONRPC"
protocol_version = "1.0"

[agent_card.capabilities]
streaming = false
push_notifications = false
extended_agent_card = false

[agent_card.security_schemes.oauth.oauth2_security_scheme]
description = "Agent Nebula OAuth 2.0"
oauth2_metadata_url = "{{OAUTH_URL}}/.well-known/oauth-authorization-server"

[agent_card.security_schemes.oauth.oauth2_security_scheme.flows.client_credentials]
token_url = "{{OAUTH_URL}}/api/v1/oauth/token"
scopes = { "agent.invoke" = "Invoke this agent" }

[[agent_card.security_requirements]]
schemes = { oauth = ["agent.invoke"] }

[[agent_card.skills]]
id = "traffic-chart"
name = "Secure Traffic Chart"
description = "Render traffic as A2UI over OAuth-protected HTTPS A2A"
tags = ["example", "a2a", "a2ui", "oauth", "https"]
security_requirements = [{ schemes = { oauth = ["agent.invoke"] } }]
