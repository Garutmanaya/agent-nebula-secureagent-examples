[project]
name = "agent-nebula-secureagent-examples"
version = "0.1.0"
description = "Runnable and forward-compatible examples for agent-nebula-secureagent"
requires-python = ">=3.12"
dependencies = ["agent-nebula-secureagent"]

[dependency-groups]
dev = ["ruff>=0.12,<1.0"]

[tool.uv.sources]
agent-nebula-secureagent = { path = "../agent-nebula-secureagent", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
